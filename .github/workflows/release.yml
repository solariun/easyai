name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git ../llama.cpp

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev libssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package
        run: |
          cmake --install build --prefix build/install
          tar -czf easyai-${{ github.ref_name }}-linux-x86_64.tar.gz -C build/install .

      - uses: actions/upload-artifact@v4
        with:
          name: easyai-linux-x86_64
          path: easyai-${{ github.ref_name }}-linux-x86_64.tar.gz

  build-linux-aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git ../llama.cpp

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-aarch64-linux-gnu

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux-gnu.cmake \
            -DEASYAI_WITH_CURL=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package
        run: |
          cmake --install build --prefix build/install
          tar -czf easyai-${{ github.ref_name }}-linux-aarch64.tar.gz -C build/install .

      - uses: actions/upload-artifact@v4
        with:
          name: easyai-linux-aarch64
          path: easyai-${{ github.ref_name }}-linux-aarch64.tar.gz

  build-linux-armhf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git ../llama.cpp

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-arm-linux-gnueabihf

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/armhf-linux-gnu.cmake \
            -DEASYAI_WITH_CURL=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package
        run: |
          cmake --install build --prefix build/install
          tar -czf easyai-${{ github.ref_name }}-linux-armhf.tar.gz -C build/install .

      - uses: actions/upload-artifact@v4
        with:
          name: easyai-linux-armhf
          path: easyai-${{ github.ref_name }}-linux-armhf.tar.gz

  publish:
    needs: [build-linux-x86_64, build-linux-aarch64, build-linux-armhf]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/easyai-linux-x86_64/*.tar.gz
            artifacts/easyai-linux-aarch64/*.tar.gz
            artifacts/easyai-linux-armhf/*.tar.gz
